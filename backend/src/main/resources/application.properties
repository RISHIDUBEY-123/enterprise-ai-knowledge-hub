spring.application.name=enterprise-ai-knowledge-hub

# Database
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/enterprise-ai-knowledge-hub}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1}
spring.ai.openai.chat.options.temperature=0.2
