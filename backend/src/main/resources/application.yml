spring:
  application:
    name: enterprise-ai-knowledge-hub

  profiles:
    active: local

  data:
    mongodb:
      uri: mongodb://localhost:27017/aihub

    redis:
      host: localhost
      port: 6379
      timeout: 5s

  cache:
    type: redis

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        model: llama3.2

      embedding:
        model: nomic-embed-text

    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: aihub-documents
        initialize-schema: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.rishi.aihub: DEBUG
    org.springframework.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ai-knowledge-hub

  prometheus:
    metrics:
      export:
        enabled: true

storage:
  upload-dir: uploads
  max-size: 10485760

rag:
  chunk:
    size: 1000
    overlap: 200

ai:
  retrieval:
    top-k: 10
    similarity-threshold: 0.70
    reranking-enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000